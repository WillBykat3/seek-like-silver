# Weekly backup of Seek Like Silver's data (answers, profiles, groups, share links, and the
# sign-in accounts), ENCRYPTED with a passphrase only you know, kept for 90 days.
#
# This repository is public, and anyone signed in to GitHub can download a workflow's files,
# so the backup is never stored unencrypted. Setup (one time) is in SETUP.md, "Backups":
#   repository secrets SUPABASE_DB_URL (Session pooler connection string) and BACKUP_PASSPHRASE.
name: Weekly backup

on:
  schedule:
    - cron: "23 7 * * 0"      # Sundays, 07:23 UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - name: Check setup
        id: check
        run: |
          if [ -z "$SUPABASE_DB_URL" ] || [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::warning::Backups aren't set up yet (see SETUP.md, Backups). Skipping."
            echo "ready=no" >> "$GITHUB_OUTPUT"
          elif [ ${#BACKUP_PASSPHRASE} -lt 16 ]; then
            echo "::error::BACKUP_PASSPHRASE must be at least 16 characters."; exit 1
          else
            echo "ready=yes" >> "$GITHUB_OUTPUT"
          fi

      - name: Install pg_dump 17
        if: steps.check.outputs.ready == 'yes'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y >/dev/null
          sudo apt-get install -y -qq postgresql-client-17
          /usr/lib/postgresql/17/bin/pg_dump --version

      - name: Dump and encrypt
        if: steps.check.outputs.ready == 'yes'
        run: |
          set -euo pipefail
          umask 077
          PGDUMP=/usr/lib/postgresql/17/bin/pg_dump
          STAMP=$(date -u +%Y-%m-%d)
          DIR=$(mktemp -d)
          # 1) Everything the site created (tables, functions, policies, data) in the public schema.
          "$PGDUMP" "$SUPABASE_DB_URL" --schema=public --no-owner --no-privileges -Fc -f "$DIR/public.dump"
          # 2) The sign-in accounts those rows belong to.
          "$PGDUMP" "$SUPABASE_DB_URL" --data-only --table=auth.users --table=auth.identities -Fc -f "$DIR/auth-accounts.dump"
          tar -C "$DIR" -czf "$DIR/sls-backup-$STAMP.tar.gz" public.dump auth-accounts.dump
          gpg --batch --yes --pinentry-mode loopback --passphrase-fd 3 --symmetric --cipher-algo AES256 \
              -o "sls-backup-$STAMP.tar.gz.gpg" "$DIR/sls-backup-$STAMP.tar.gz" 3<<<"$BACKUP_PASSPHRASE"
          rm -rf "$DIR"
          ls -l sls-backup-*.gpg

      - name: Keep the encrypted file for 90 days
        if: steps.check.outputs.ready == 'yes'
        uses: actions/upload-artifact@v4
        with:
          name: sls-backup-encrypted
          path: sls-backup-*.tar.gz.gpg
          retention-days: 90
          if-no-files-found: error
