# Keeps the free Supabase project from pausing (it pauses after about a week with no activity).
# Every 2 days this makes one tiny, public request to the database. No secrets needed.
name: Keep Supabase awake

on:
  schedule:
    - cron: "17 13 */2 * *"   # every 2 days, 13:17 UTC
  workflow_dispatch: {}        # "Run workflow" button in the Actions tab

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Ping the database
        run: |
          # The address and publishable key are already public in config.js.
          URL=$(grep -oP 'SUPABASE_URL\s*=\s*"\K[^"]+' config.js)
          KEY=$(grep -oP 'SUPABASE_PUBLISHABLE_KEY\s*=\s*"\K[^"]+' config.js)
          ping() {
            curl -s -o /dev/null -w "%{http_code}" -X POST "$URL/rest/v1/rpc/$1" \
              -H "apikey: $KEY" -H "Content-Type: application/json" -d "$2"
          }
          code=$(ping sls_ping '{}')
          echo "sls_ping: $code"
          if [ "$code" != "200" ]; then
            # Before database update 011 is run, use a function that already exists.
            code=$(ping sls_shared_answer '{"p_token":"000000000000000000000000"}')
            echo "sls_shared_answer: $code"
          fi
          [ "$code" = "200" ] || { echo "::error::Supabase did not answer (HTTP $code). If the project is paused, restore it in the Supabase dashboard."; exit 1; }
